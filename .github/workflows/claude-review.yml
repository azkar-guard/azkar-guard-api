# Claude reviews each PR when it's opened or marked ready, with inline comments.
# Based on anthropics/claude-code-action examples/pr-review-comprehensive.yml. It doesn't
# re-review every push, to save the Claude Pro subscription's limits: comment "@claude review"
# for another pass. PRs from forks get no secrets, so they're skipped.
name: Claude review

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Report only real problems, most severe first:
            1. Bugs: wrong behaviour, unhandled errors and edge cases, broken builds or tests.
            2. Security: injection, secrets or tokens in code, config or committed files (including
               Terraform plan and state files), unsafe input handling, overly broad permissions.
            3. Missing or wrong tests for the changed behaviour.
            4. Docs (README, CREDITS.md, PRIVACY.md) that the change makes out of date.

            Rules:
            - Follow the conventions already in the repo; don't suggest new tools or large refactors.
            - The azkar text, Qur'an verses and hadith are verbatim from their sources (see CREDITS.md):
              never suggest editing them.
            - Put each issue as an inline comment on the exact line. If you find nothing worth fixing,
              leave one short top-level comment saying so. No praise, no summaries of the diff.
          claude_args: |
            --max-turns 20
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
